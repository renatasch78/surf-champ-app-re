# ======================
# Local Development Profile
# ======================
# This profile is for local development without AWS S3

# ======================
# AWS S3 Configuration - Mock/Local Values
# ======================
aws.s3.bucket-name=local-bucket
aws.s3.bucket.name=local-bucket
aws.region=us-east-1
aws.access.key.id=mock-access-key
aws.secret.access.key=mock-secret-key

# ======================
# Database Configuration
# ======================
spring.datasource.url=jdbc:postgresql://localhost:5432/surf_champ
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================
# Redis Configuration
# ======================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.shutdown-timeout=100

# ======================
# JPA/Hibernate Configuration
# ======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# ======================
# Server Configuration
# ======================
server.port=8080
server.servlet.context-path=/

# ======================
# File Upload Configuration
# ======================
file.upload.max-file-size=104857600
# File Upload Configuration
# ======================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ======================
# Logging Configuration
# ======================
logging.level.root=INFO
logging.level.com.surfchamp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO


