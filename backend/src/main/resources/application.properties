spring.profiles.active=local

# Database configuration is provided by the active profile file.

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.shutdown-timeout=100

aws.region=us-east-1
aws.access.key.id=${AWS_ACCESS_KEY:}
aws.secret.access.key=${AWS_SECRET_KEY:}
aws.s3.bucket-name=surf-champ-videos

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.type=trace
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration-ms=86400000

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

cors.allowed-origins=http://localhost:3000,http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
