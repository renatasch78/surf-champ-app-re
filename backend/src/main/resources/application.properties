spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Redis (usar só URL)
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# AWS
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME}
aws.region=us-east-1
aws.access.key.id=${AWS_ACCESS_KEY_ID}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY}

# PostgreSQL
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server
server.address=0.0.0.0
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS (ex.: https://seu-frontend.vercel.app,https://*.vercel.app)
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:3001,http://localhost:4200}

# OAuth2 Google (desligado por padrão; habilite em produção com APP_AUTH_GOOGLE_ENABLED=true)
app.auth.google.enabled=${APP_AUTH_GOOGLE_ENABLED:false}
app.auth.frontend-callback-url=${APP_AUTH_FRONTEND_CALLBACK_URL:http://localhost:3000/login}
